services:
  app:
    build: .
    container_name: app
    restart: always
    environment:
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      DOMAIN: ${DOMAIN}
      GRADES: ${GRADES}
      LOCATIONS: ${LOCATIONS}
      SECRET_KEY: ${SECRET_KEY}
      VALKEY_URL: redis://${VALKEY_HOST}:${VALKEY_PORT}
    expose:
      - 8080
    networks:
      - network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./requirements.txt
          target: /home/appuser/requirements.txt
        - action: sync+restart
          path: ./app
          target: /home/appuser/app
        - action: sync+restart
          path: ./config.py
          target: /home/appuser/config.py
    cpus: 4.0
    mem_limit: 1024mb

  db:
    image: postgres:18-alpine
    container_name: db
    restart: always
    ports:
      - 5432:5432
    expose:
      - 5432
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - network
    volumes:
      - pg_data:/var/lib/postgresql
      - ./data:/data
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512mb

  cache:
    image: valkey/valkey:9-alpine
    container_name: cache
    restart: always
    expose:
      - 6379
    networks:
      - network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - valkey_data:/data
    mem_limit: 128mb

  web:
    build: ./web
    container_name: web
    restart: always
    ports:
      - 443:443
    networks:
      - network
    healthcheck:
      test: ["CMD", "curl", "-kfs", "https://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./web/package.json
        - action: sync+restart
          path: ./web/nginx.conf
          target: /etc/nginx/conf.d/nginx.conf
        - action: rebuild
          path: ./web/src
    mem_limit: 256mb

networks:
  network:

volumes:
  valkey_data:
  pg_data:
