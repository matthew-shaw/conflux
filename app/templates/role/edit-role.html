{%- extends "base.html" -%}

{%- block beforeContent -%}
{{ super() }}
{%- endblock -%}

{%- block content -%}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    {{ super() }}
    <h1 class="govuk-heading-xl">Edit role</h1>
    <form method="post" action="{{ url_for('role.edit', id=role.id) }}" novalidate>
      {{ form.csrf_token}}
      {{ form.name }}
      <div class="govuk-button-group">
        {{ form.save(params={
          'preventDoubleClick': true
        }) }}
        <a class="govuk-link" href="{{ url_for('role.view', id=role.id) }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{%- endblock -%}
