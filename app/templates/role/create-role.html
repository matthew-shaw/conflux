{%- extends "base.html" -%}

{%- block beforeContent -%}
{{ super() }}
{%- endblock -%}

{%- block content -%}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    {{ super() }}
    <h1 class="govuk-heading-xl">Create a new role</h1>
    <form method="post" action="" novalidate>
      {{ form.csrf_token}}
      {{ form.title }}
      <div class="govuk-button-group">
        {{ form.save }}
        <a class="govuk-link" href="{{ url_for('role.list') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{%- endblock -%}
