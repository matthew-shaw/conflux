# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: ["latest"]
  pull_request:
    branches: ["latest"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Check dependencies for known security vulnerabilities
        run: uv audit --preview-features audit-command --locked --no-default-groups
      - name: Check code for potential security vulnerabilities
        run: uv run bandit -r . -x /tests,/data
      - name: Static type checking
        run: uv run mypy .
      - name: Check code formatting
        run: |
          uv run black . -t py314 -l 120 --check
          uv run isort . -c
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      - name: Test with pytest
        run: uv run pytest --cov=app --cov-report=term-missing --cov-branch
